name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  gravacao:
    # Grava o exemplo de ponta a ponta e guarda o vídeo como artefato.
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node exemplos/loja-demo/servir.mjs &
      - run: npm run demo:gravar
      - uses: actions/upload-artifact@v4
        with:
          name: video-demo
          path: saida/
          retention-days: 7
